<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Samatvam Participation · IIM Bodh Gaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Look: bold outlines, chunky uppercase headings, pink / yellow / blue blocks, pill buttons */
:root{--ink:#111;--paper:#f7f5ef;--pink:#e76cf2;--yellow:#f8ef4f;--blue:#2f97f2;--green:#3ccf6e;--orange:#ff9f2e;--red:#ff5a4e;--line:3px solid var(--ink);--shadow:4px 4px 0 var(--ink)}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "DM Sans",system-ui,sans-serif;background:var(--paper);color:var(--ink)}
h1,h2,h3{font-family:"Archivo Black",Impact,sans-serif;text-transform:uppercase;letter-spacing:.5px;line-height:1.1}
h2{font-size:24px}
header{margin:12px auto 0;max-width:980px;background:#fff;border:var(--line);border-radius:999px;padding:8px 10px 8px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
header b{font-family:"Archivo Black",sans-serif;text-transform:uppercase;font-size:15px;margin-right:auto;letter-spacing:.5px}
header b::before{content:"✺ ";color:var(--pink)}
main{max-width:980px;margin:0 auto;padding:18px 14px 40px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
button{font:700 14px "DM Sans",sans-serif;border:2.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;transition:transform .08s,box-shadow .08s}
button:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
button:active{transform:none;box-shadow:none}
button.main{background:var(--ink);color:#fff}
button.on{background:var(--yellow);color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
input,select,textarea{font:inherit;padding:8px 12px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;max-width:100%;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;box-shadow:3px 3px 0 var(--blue)}
.card{background:#fff;border:var(--line);border-radius:22px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dim{color:#555;font-size:13px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:2px solid #e6e3da;vertical-align:middle}
th{font:12px "Archivo Black",sans-serif;text-transform:uppercase;letter-spacing:.5px;color:var(--ink);border-bottom:var(--line)}
tr.me td{background:var(--yellow);font-weight:700}
.scroll{overflow-x:auto}
.mk{min-width:48px;padding:7px 6px}
.mk.yes.on{background:var(--green)}
.mk.partly.on{background:var(--orange)}
.mk.no.on{background:var(--red);color:#fff}
.mk.exc.on{background:var(--blue);color:#fff}
.flag{background:var(--red);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700}
.flag.y{background:var(--yellow);color:var(--ink)}
.pill{background:var(--pink);border:2px solid var(--ink);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;color:var(--ink)}
.warn{background:var(--yellow)}
.bad{background:var(--pink)}
.stat{display:inline-block;min-width:130px;margin:0 10px 10px 0;padding:12px 14px;border:var(--line);border-radius:18px;background:var(--blue);color:#fff;box-shadow:var(--shadow)}
.stat:nth-of-type(3n+2){background:var(--yellow);color:var(--ink)}
.stat:nth-of-type(3n+3){background:var(--pink);color:var(--ink)}
.stat .dim{color:inherit;opacity:.85}
.stat b{display:block;font:30px "Archivo Black",sans-serif}
.mrow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 0;border-bottom:2px solid #e6e3da}
.mrow:last-child{border-bottom:0}
details.card summary{list-style:none}
.gate{max-width:480px;margin:70px auto;text-align:center;padding:28px}
.gate h2{font-size:30px}
.gate button.main{font-size:16px;padding:11px 22px;background:var(--yellow);color:var(--ink);box-shadow:var(--shadow)}
.spin{width:22px;height:22px;border:3px solid #ddd;border-top-color:var(--pink);border-radius:50%;animation:s .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
@media(max-width:600px){.hide-sm{display:none}header{margin:8px 8px 0;border-radius:24px}h2{font-size:20px}}
</style>
</head>
<body>
<div id="app"><div class="card gate"><span class="spin"></span>Loading…</div></div>
<script type="module">
// ===================== Samatvam Participation Tracker (live) =====================
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut as fbSignOut } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, collection, onSnapshot, writeBatch, updateDoc, setDoc, deleteDoc, serverTimestamp, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

// ---- Firebase settings (safe to be public; the database rules do the protecting)
const firebaseConfig = {
  apiKey: "AIzaSyAOHmaOkPHzvs075HlhRv4RDF4V0qSnmak",
  authDomain: "samatvam-tracker.firebaseapp.com",
  projectId: "samatvam-tracker",
  appId: "1:954477611347:web:a8f2f0aee306e9411ef9a6",
};
const FIRST_ADMIN = "neham.r2028@iimbg.ac.in";
const VERSION = "v8 · 24 Nov"; // shown on the sign-in screens, so a screenshot tells us which copy of the page someone has

const PART = ["MBA 11", "MBA 12", "IPM 05", "IPM 06"];
const BATCHES = [...PART, "Faculty"];
const ROLES = { member: "Member", poc: "PoC", faculty: "Faculty" };
const RES = {
  yes:    { label: "Present",  short: "+1",   score: 1,    reason: false },
  partly: { label: "Slacking", short: "−0.5", score: -0.5, reason: true },
  no:     { label: "Absent",   short: "−1",   score: -1,   reason: false },
  exc:    { label: "Excused",  short: "0",    score: 0,    reason: true },
};
// The member list is NOT stored in this public file. A PoC pastes it once on the Members page,
// and it goes straight into the private database.

// ---------------------------------------------------------------- helpers
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rnd = (p) => p + Math.random().toString(36).slice(2, 10);
const pts = (n) => (n > 0 ? "+" + n : n < 0 ? "−" + Math.abs(n) : "0");
const ms = (v) => (v && typeof v.toMillis === "function" ? v.toMillis() : typeof v === "number" ? v : Date.now());
const when = (t) => new Date(ms(t)).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
const okEmail = (e) => /^[^\s@/]+@[^\s@/]+\.[^\s@/]+$/.test(e);
// ---- Who is this email? Students: first.<surname letter><year>[i]@iimbg.ac.in. Anyone else at the college: faculty.
const STUDENT_RE = /^([a-z]+)\.([a-z])\d{4}i?$/;
function parseEmail(email) {
  const [local = "", domain = ""] = (email || "").toLowerCase().split("@");
  const college = domain === "iimbg.ac.in";
  const m = local.match(STUDENT_RE);
  if (m) return { student: true, first: m[1], initial: m[2], handle: m[1] + "." + m[2], college };
  const first = (local.split(/[._\-0-9]/)[0] || "").replace(/[^a-z]/g, "");
  return { student: false, first, initial: "", handle: first, college };
}
const nameParts = (n) => (n || "").toLowerCase().replace(/\b(dr|prof|mr|mrs|ms)\.?\s+/g, "").replace(/\b(ma'?am|sir)\b/g, "")
  .split(/\s+/).map((p) => p.replace(/[^a-z]/g, "")).filter(Boolean);
// The email name a member should have: "chaitanya.g" for a student with a surname, "sweta" for faculty.
// Students listed by first name only (e.g. "Princi") get "princi." and match on first name.
function handleOf(m) {
  if (!m.name || /^unnamed|\(/i.test(m.name)) return "";
  const p = nameParts(m.name);
  if (!p.length) return "";
  if (m.batch === "Faculty") return p[0];
  return p.length > 1 ? p[0] + "." + p[1][0] : p[0] + ".";
}
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
// Likely matches for a sign-in request, best first. Allows 1–2 letters to differ.
function guesses(email, gname) {
  const p = parseEmail(email), g = nameParts(gname)[0] || "";
  return D.members.filter((m) => !m.email && (m.batch === "Faculty") === !p.student).map((m) => {
    const parts = nameParts(m.name), first = parts[0] || "";
    let d = Math.min(lev(p.first, first), g ? lev(g, first) : 99);
    if (p.initial && parts[1]) d += parts[1][0] === p.initial ? -0.5 : 1;
    return { m, d, ok: d <= (first.length >= 6 ? 2 : 1) };
  }).filter((x) => x.ok).sort((a, b) => a.d - b.d).slice(0, 3).map((x) => x.m);
}

function friendly(e) {
  const c = e?.code || "";
  if (c.includes("permission-denied")) return "Not allowed. Your account doesn't have permission to do this.";
  if (c.includes("unavailable")) return "You seem to be offline. Check your internet and try again.";
  if (c === "auth/unauthorized-domain") return "This website address isn't allowed for Google sign-in yet (Firebase → Authentication → Settings → Authorized domains).";
  return e?.message || String(e);
}
function toast(msg) { alert(msg); }

const configured = !Object.values(firebaseConfig).some((v) => String(v).includes("PASTE"));
const fb = configured ? initializeApp(firebaseConfig) : null;
const auth = fb ? getAuth(fb) : null;
const db = fb ? getFirestore(fb) : null;
const google = new GoogleAuthProvider();
google.setCustomParameters({ prompt: "select_account" });

// ---------------------------------------------------------------- state
const S = { phase: configured ? "loading" : "unconfigured", reason: "", email: "", myName: "", acc: null,
  tab: "", ev: "", sub: "", q: "", batch: "all", subsOpen: false, viewAs: "", log: null };
const D = { members: [], events: [], sheets: {}, requests: [], settings: { yellowAt: 3, redAt: 4 } };
let unsub = [];
const stopAll = () => { unsub.forEach((u) => u()); unsub = []; };

const isStaff = () => S.email === FIRST_ADMIN || ["poc", "faculty"].includes(S.acc?.role);
const myMid = () => S.acc?.mid || "";
const byId = (id) => D.members.find((m) => m.id === id);
// Whose screen we show: yourself, or the member a PoC is previewing.
const viewer = () => (S.viewAs ? byId(S.viewAs) : byId(myMid()));
const staffView = () => isStaff() && !S.viewAs;
const isFaculty = () => S.acc?.role === "faculty";

// ---------------------------------------------------------------- numbers
const units = (e) => (e.subs && e.subs.length ? e.subs : [{ id: e.id, name: "" }]);
const markOf = (unitId, mid) => D.sheets[unitId]?.marks?.[mid] || null;
const participants = () => D.members.filter((m) => m.batch !== "Faculty");
const membersOf = (e) => D.members.filter((m) => e.batches.includes(m.batch));

// Points: every mark counts. "Absent in a row": each event counts once (present if they came to any sub-event).
function stats(mid) {
  const s = { yes: 0, partly: 0, no: 0, exc: 0, points: 0, events: 0, came: 0, absEv: 0, streak: 0, longest: 0 };
  const evs = [...D.events].sort((a, b) => (a.date || "").localeCompare(b.date || "") || ms(a.at) - ms(b.at));
  for (const e of evs) {
    const rs = units(e).map((u) => markOf(u.id, mid)).filter(Boolean);
    if (!rs.length) continue;
    for (const r of rs) { s[r.v]++; s.points += RES[r.v].score; }
    s.events++;
    const came = rs.some((r) => r.v === "yes" || r.v === "partly"), absent = !came && rs.some((r) => r.v === "no");
    if (came) { s.came++; s.streak = 0; }
    else if (absent) { s.absEv++; s.streak++; s.longest = Math.max(s.longest, s.streak); }
  }
  s.level = s.streak >= D.settings.redAt ? "red" : s.streak >= D.settings.yellowAt ? "yellow" : "";
  return s;
}
const flagTag = (s) => s.level === "red" ? `<span class="flag">🔴 ${s.streak} absent in a row</span>` : s.level === "yellow" ? `<span class="flag y">🟡 ${s.streak} absent in a row</span>` : "";

// ---------------------------------------------------------------- sign-in
if (configured) {
  getRedirectResult(auth).catch((e) => toast(friendly(e)));
  onAuthStateChanged(auth, (u) => { stopAll(); S.acc = null; S.viewAs = ""; if (!u) { S.phase = "signin"; render(); return; } checkAccess(u); });
} else render();

async function checkAccess(u) {
  S.phase = "loading"; render();
  S.email = (u.email || "").toLowerCase(); S.myName = u.displayName || S.email;
  try {
    const a = await getDoc(doc(db, "access", S.email));
    S.acc = a.exists() ? a.data() : null;
    if (!S.acc && S.email !== FIRST_ADMIN) {
      if (await tryClaim()) return checkAccess(u);
      await askToJoin(); S.phase = "denied"; render(); return;
    }
    S.tab = isFaculty() ? "overview" : isStaff() ? "events" : "mine";
    listen();
  } catch (e) { S.phase = "error"; S.reason = friendly(e); render(); }
}
// A sure match (exact name, and surname letter for students) links the person straight away.
// The database rules check the same thing, so nobody can claim someone else's name.
async function tryClaim() {
  const p = parseEmail(S.email);
  if (!p.college || !p.handle) return false;
  try {
    // Students: try "first.s" (name + surname letter), then "first." (listed by first name only).
    let h = await getDoc(doc(db, "handles", p.handle));
    if ((!h.exists() || !h.data().mid) && p.student) h = await getDoc(doc(db, "handles", p.first + "."));
    if (!h.exists() || !h.data().mid) return false;
    const { mid, role } = h.data();
    const b = writeBatch(db);
    b.set(doc(db, "access", S.email), { mid, role, self: true });
    b.update(doc(db, "members", mid), { email: S.email });
    await b.commit();
    await deleteDoc(doc(db, "requests", S.email)).catch(() => undefined); // clear an old request, if any
    return true;
  } catch (e) { console.warn("Automatic match failed", e); return false; }
}
async function askToJoin() {
  try { await setDoc(doc(db, "requests", S.email), { email: S.email, gname: S.myName, at: serverTimestamp() }); S.requested = true; }
  catch (e) { S.requested = false; }
}
async function signIn() {
  try { await signInWithPopup(auth, google); }
  catch (e) {
    if (e?.code === "auth/popup-blocked" || e?.code === "auth/operation-not-supported-in-this-environment") return signInWithRedirect(auth, google);
    if (e?.code === "auth/popup-closed-by-user" || e?.code === "auth/cancelled-popup-request") return;
    toast(friendly(e));
  }
}

let scheduled = false;
const schedule = () => { if (scheduled) return; scheduled = true; setTimeout(() => { scheduled = false; render(); }, 0); };
function listen() {
  const wait = new Set(["members", "events", "sheets", "config"]);
  const done = (k) => { wait.delete(k); if (!wait.size) S.phase = "ready"; schedule(); };
  const fail = (e) => { S.phase = "error"; S.reason = friendly(e); render(); };
  unsub.push(onSnapshot(collection(db, "members"), (q) => { D.members = q.docs.map((d) => ({ ...d.data(), id: d.id })).sort((a, b) => a.name.localeCompare(b.name)); syncHandles(); done("members"); }, fail));
  if (isStaff()) unsub.push(onSnapshot(collection(db, "requests"), (q) => { D.requests = q.docs.map((d) => d.data({ serverTimestamps: "estimate" })); schedule(); }, () => undefined));
  unsub.push(onSnapshot(collection(db, "events"), (q) => { D.events = q.docs.map((d) => ({ ...d.data({ serverTimestamps: "estimate" }), id: d.id })); done("events"); }, fail));
  unsub.push(onSnapshot(collection(db, "sheets"), (q) => { D.sheets = Object.fromEntries(q.docs.map((d) => [d.id, d.data({ serverTimestamps: "estimate" })])); done("sheets"); }, fail));
  unsub.push(onSnapshot(doc(db, "config", "settings"), (d) => { if (d.exists()) D.settings = { yellowAt: 3, redAt: 4, ...d.data() }; done("config"); }, fail));
  // Notice straight away if this person's access is changed.
  unsub.push(onSnapshot(doc(db, "access", S.email), (d) => {
    const n = d.exists() ? d.data() : null;
    if (!n && S.email !== FIRST_ADMIN) { stopAll(); S.phase = "denied"; render(); return; }
    if ((n?.role || "") !== (S.acc?.role || "") && S.acc) { location.reload(); return; }
    S.acc = n; schedule();
  }, () => undefined));
}

async function addLog(entry) {
  await setDoc(doc(collection(db, "log")), { ...entry, by: S.email, byName: viewerName(), at: serverTimestamp() });
}
const viewerName = () => byId(myMid())?.name || S.myName;

// ---------------------------------------------------------------- screens
function gate(inner) { return `<div class="card gate">${inner}<div class="dim" style="margin-top:14px;font-size:11px">${VERSION}</div></div>`; }
function gateScreen() {
  switch (S.phase) {
    case "unconfigured": return gate(`<h2>Almost ready</h2><div class="dim">Firebase settings haven't been added to this page yet.</div>`);
    case "loading": return gate(`<span class="spin"></span>Loading…`);
    case "signin": return gate(`<h2 style="margin-top:0">Samatvam · Participation</h2><div class="dim" style="margin-bottom:12px">IIM Bodh Gaya. Sign in with the Google account Samatvam has on file for you.</div>
      <button class="main" data-a="signin">Sign in with Google</button>
      <div class="dim" style="margin-top:12px">Opened this link inside WhatsApp or Instagram? Open it in Chrome or Safari instead. Google doesn't allow sign-in inside those apps.</div>`);
    case "denied": return gate(`<h2 style="margin-top:0">Can't let you in</h2><div>Signed in as <b>${esc(S.email)}</b>.</div><div class="dim" style="margin:8px 0">${S.requested ? "We couldn't match this email to a name on the Samatvam list for sure, so we've sent a request to the PoCs. Once one of them approves it, come back and sign in again." : "This email isn't on the Samatvam list. Ask a PoC to add it next to your name."}</div><div class="row" style="justify-content:center"><button class="main" data-a="retry">Try again</button><button data-a="signout">Use a different Google account</button></div>`);
    case "error": return gate(`<h2 style="margin-top:0">Something went wrong</h2><div class="card bad">${esc(S.reason)}</div><button class="main" data-a="reload">Try again</button> <button data-a="signout">Sign out</button>`);
  }
  return "";
}

function layout(body) {
  const v = viewer();
  const roleName = S.viewAs ? "Preview" : ROLES[S.acc?.role] || "PoC";
  let tabs;
  if (staffView()) {
    tabs = [["overview", "Overview"], ["events", "Mark attendance"], ["ranking", "Ranking"], ["summary", "Everyone"], ["members", "Members"], ["log", "History"]];
    if (byId(myMid()) && !isFaculty()) tabs.push(["mine", "My record"]);
  } else tabs = [["mine", "My record"], ["ranking", "Ranking"]];
  return `<header><b>Samatvam · Participation</b><span>${esc(v?.name || S.myName)} <span class="pill">${roleName}</span></span><button data-a="signout">Sign out</button></header>
  ${S.viewAs ? `<div style="background:#fff4d6;padding:8px 14px" class="row"><b>Preview:</b> this is what ${esc(v?.name)} sees. <button data-a="stopPreview">Stop preview</button></div>` : ""}
  <main>${staffView() && D.requests.length && S.tab !== "members" ? `<div class="card warn row" style="justify-content:space-between"><b>🔔 ${D.requests.length} ${D.requests.length === 1 ? "person is" : "people are"} waiting for approval</b><button class="main" data-a="tab" data-k="members">Review</button></div>` : ""}<nav>${tabs.map(([k, l]) => `<button class="${S.tab === k ? "on" : ""}" data-a="tab" data-k="${k}">${l}</button>`).join("")}</nav>${body}</main>`;
}

function overviewScreen() {
  const all = participants().map((m) => ({ m, s: stats(m.id) }));
  const top = all.filter((x) => x.s.absEv > 0).sort((a, b) => b.s.absEv - a.s.absEv || b.s.streak - a.s.streak || a.m.name.localeCompare(b.m.name)).slice(0, 5);
  const red = all.filter((x) => x.s.level === "red"), yel = all.filter((x) => x.s.level === "yellow");
  return `${red.length ? `<div class="card bad"><b>🔴 Red flag (${red.length})</b> · absent in ${D.settings.redAt}+ events in a row: ${red.map((x) => esc(x.m.name)).join(", ")}</div>` : ""}
  ${yel.length ? `<div class="card warn"><b>🟡 Warning (${yel.length})</b> · absent in ${D.settings.yellowAt} events in a row: ${yel.map((x) => esc(x.m.name)).join(", ")}</div>` : ""}
  <div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Most absences · top 5</h2><button class="main" data-a="tab" data-k="events">Mark attendance →</button></div>
    <div class="dim" style="margin:4px 0 8px">${D.events.length} events so far · ${participants().length} members</div>
    ${top.length ? `<div class="scroll"><table><tr><th>#</th><th>Name</th><th>Batch</th><th>Absent</th><th>In a row now</th><th>Excused</th><th>Points</th></tr>
    ${top.map(({ m, s }, i) => `<tr><td>${i + 1}</td><td><b>${esc(m.name)}</b></td><td>${m.batch}</td><td><b style="font-size:18px">${s.absEv}</b> of ${s.events} events</td><td>${s.streak} ${flagTag(s)}</td><td>${s.exc}</td><td>${pts(s.points)}</td></tr>`).join("")}</table></div>`
    : `<div class="dim">Nobody has missed an event yet.</div>`}
    <div style="margin-top:8px"><button data-a="tab" data-k="summary">See everyone →</button></div></div>`;
}

function batchButtons(list) {

// Everyone can see the ranking: points, then fewer absences.
function rankingScreen() {
  const me = viewer()?.id;
  const rows = participants().map((m) => ({ m, s: stats(m.id) }))
    .sort((a, b) => b.s.points - a.s.points || a.s.absEv - b.s.absEv || a.m.name.localeCompare(b.m.name));
  let rank = 0, prev = null;
  rows.forEach((r, i) => { const key = r.s.points + "|" + r.s.absEv; if (key !== prev) { rank = i + 1; prev = key; } r.rank = rank; });
  const shown = rows.filter(({ m }) => S.batch === "all" || m.batch === S.batch);
  const mine = rows.find((r) => r.m.id === me);
  return `${mine ? `<div class="card"><span class="stat"><span class="dim">Your rank</span><b>#${mine.rank}</b><span class="dim">of ${rows.length}</span></span><span class="stat"><span class="dim">Your points</span><b>${pts(mine.s.points)}</b></span></div>` : ""}

function render() {
  const f = document.activeElement, fid = f?.id, pos = f?.selectionStart;
  if (S.phase !== "ready") { $("app").innerHTML = gateScreen(); return; }
  if (!staffView() && !["mine", "ranking"].includes(S.tab)) S.tab = "mine";
  if (staffView() && S.tab === "mine" && (!byId(myMid()) || isFaculty())) S.tab = "overview";
  let body;
  if (S.tab === "overview") body = overviewScreen();
  else if (S.tab === "events") body = S.ev ? markScreen() : eventsScreen();
  else if (S.tab === "ranking") body = rankingScreen();
  else if (S.tab === "summary") body = summaryScreen();
  else if (S.tab === "members") body = membersScreen();
  else if (S.tab === "log") body = logScreen();
  else body = mineScreen();
  $("app").innerHTML = layout(body);
  if (fid === "q" && $("q")) { $("q").focus(); if (pos != null) $("q").setSelectionRange(pos, pos); }
}

// ---------------------------------------------------------------- writes
async function run(fn) { try { await fn(); } catch (e) { toast(friendly(e)); } }

async function setMark(e, unitId, mid, v, reason) {
  if (mid === myMid()) return toast("You can't mark yourself.");
  const prev = markOf(unitId, mid);
  if (prev && prev.v === v && (prev.reason || "") === (reason || "")) return;
  if (!D.sheets[unitId]) { await setDoc(doc(db, "sheets", unitId), { eid: e.id, marks: {} }); D.sheets[unitId] = { eid: e.id, marks: {} }; }
  await updateDoc(doc(db, "sheets", unitId), { [`marks.${mid}`]: { v, reason: reason || "", by: S.email, byName: viewerName(), at: serverTimestamp() }, last: mid });
  const sub = (e.subs || []).find((x) => x.id === unitId);
  await addLog({ eid: e.id, evName: e.name, sub: sub ? sub.id : "", subName: sub ? sub.name : "", mid, midName: byId(mid)?.name || "", from: prev ? prev.v : null, to: v, reason: reason || "" }).catch(() => undefined);
  S.log = null;
}

// One-time fill of the email-name lookup for members added before it existed (runs for PoCs).
let syncing = false;
async function syncHandles() {
  if (syncing || !isStaff() || !D.members.some((m) => (m.handle || "") !== handleOf(m))) return;
  syncing = true;
  try {
    const by = {};
    for (const m of D.members) { const h = handleOf(m); if (h) (by[h] = by[h] || []).push(m); }
    const b = writeBatch(db);
    for (const m of D.members) if ((m.handle || "") !== handleOf(m)) b.update(doc(db, "members", m.id), { handle: handleOf(m) });
    for (const [h, ms] of Object.entries(by)) b.set(doc(db, "handles", h), { mid: ms.length === 1 ? ms[0].id : "", role: ms[0].role });
    await b.commit();
  } catch (e) { console.warn("Could not update the email-name lookup", e); }
  syncing = false;
}

// Writes a member and keeps their sign-in (access) record in step.
function writeMember(b, m, old) {
  const { id, ...data } = m;
  data.handle = handleOf(m);
  b.set(doc(db, "members", id), data);
  const owners = (h) => D.members.filter((x) => x.id !== id && handleOf(x) === h);
  if (data.handle) b.set(doc(db, "handles", data.handle), { mid: owners(data.handle).length ? "" : id, role: m.role });
  if (old?.handle && old.handle !== data.handle) {
    const rest = owners(old.handle);
    if (!rest.length) b.delete(doc(db, "handles", old.handle));
    else b.set(doc(db, "handles", old.handle), { mid: rest.length === 1 ? rest[0].id : "", role: rest[0].role });
  }
  if (old?.email && old.email !== m.email) b.delete(doc(db, "access", old.email));
  if (m.email) b.set(doc(db, "access", m.email), { mid: id, role: m.role });
}

const A = {
  signin: () => signIn(),
  signout: () => { stopAll(); fbSignOut(auth); },
  reload: () => location.reload(),
  // Always fetch the newest copy of the page (phones often keep an old one), then check again.
  retry: () => { location.href = location.pathname + "?r=" + Date.now(); },
  tab: (d) => { S.tab = d.k; S.ev = ""; S.q = ""; S.batch = "all"; render(); },
  batch: (d) => { S.batch = d.k; render(); },
  preview: (d) => { S.viewAs = d.m; S.tab = "mine"; render(); },
  stopPreview: () => { S.viewAs = ""; S.tab = "members"; render(); },
  seed: () => run(async () => {
    if (D.members.length) return;
    const rows = $("seed-text").value.split("\n").map((l) => l.split(",").map((x) => x.trim())).filter((r) => r[0]);
    const bad = rows.filter((r) => !BATCHES.includes(r[1]) || !ROLES[(r[2] || "member").toLowerCase()] || (r[3] && !okEmail(r[3])));
    if (!rows.length) return toast("Paste the member list first.");
    if (bad.length) return toast("Please fix these lines:\n" + bad.map((r) => r.join(", ")).join("\n"));
    const b = writeBatch(db);
    for (const [name, batch, role, email] of rows)
      writeMember(b, { id: rnd("m"), name, batch, email: (email || "").toLowerCase(), role: batch === "Faculty" ? "faculty" : (role || "member").toLowerCase() }, null);
    b.set(doc(db, "config", "settings"), { yellowAt: 3, redAt: 4 });
    await b.commit();
    await addLog({ note: `Loaded the member list (${rows.length} people)` });
    location.reload();
  }),
  newEvent: () => run(async () => {
    const name = $("ev-name").value.trim();
    const batches = [...document.querySelectorAll('input[name="evb"]:checked')].map((x) => x.value);
    if (!name) return toast("Give the event a name.");
    if (!batches.length) return toast("Tick at least one batch.");
    const id = rnd("e"), b = writeBatch(db);
    b.set(doc(db, "events", id), { name, date: $("ev-date").value, batches, subs: [], by: S.email, at: serverTimestamp() });
    b.set(doc(db, "sheets", id), { eid: id, marks: {} });
    await b.commit();
    await addLog({ note: `Created event "${name}" (${batches.join(", ")})` });
  }),
  delEvent: (d) => run(async () => {
    const e = D.events.find((x) => x.id === d.id);
    if (!confirm(`Delete "${e.name}"? Its marks are removed from everyone's points. History keeps the record.`)) return;
    const b = writeBatch(db);
    b.delete(doc(db, "events", e.id));
    for (const id of new Set([e.id, ...(e.subs || []).map((x) => x.id)])) b.delete(doc(db, "sheets", id));
    await b.commit();
    await addLog({ note: `Deleted event "${e.name}"` });
  }),
  open: (d) => { S.ev = d.id; S.sub = ""; S.q = ""; S.batch = "all"; render(); },
  back: () => { S.ev = ""; render(); },
  pickSub: (d) => { S.sub = d.id; render(); },
  subsToggle: () => { S.subsOpen = !S.subsOpen; },
  addSub: () => run(async () => {
    const e = D.events.find((x) => x.id === S.ev); const name = $("sub-name").value.trim();
    if (!name) return toast("Give the sub-event a name.");
    const subs = [...(e.subs || [])];
    // First sub-event on an event that already has marks: keep them as a "Main" sub-event.
    if (!subs.length && Object.keys(D.sheets[e.id]?.marks || {}).length) subs.push({ id: e.id, name: "Main" });
    const id = rnd("s"); subs.push({ id, name });
    const b = writeBatch(db);
    b.set(doc(db, "sheets", id), { eid: e.id, marks: {} });
    b.update(doc(db, "events", e.id), { subs });
    await b.commit();
    S.sub = id; S.subsOpen = true;
    await addLog({ note: `Added sub-event "${name}" to "${e.name}"` });
  }),
  delSub: (d) => run(async () => {
    const e = D.events.find((x) => x.id === S.ev); const x = e.subs.find((y) => y.id === d.id);
    const n = Object.keys(D.sheets[d.id]?.marks || {}).length;
    if (!confirm(`Delete sub-event "${x.name}"?${n ? ` Its ${n} marks will be removed from points (History keeps them).` : ""}`)) return;
    const b = writeBatch(db);
    b.update(doc(db, "events", e.id), { subs: e.subs.filter((y) => y.id !== d.id) });
    b.delete(doc(db, "sheets", d.id));
    await b.commit(); S.sub = "";
    await addLog({ note: `Deleted sub-event "${x.name}" from "${e.name}"` });
  }),
  mark: (d) => run(async () => {
    const e = D.events.find((x) => x.id === S.ev); let reason = "";
    if (RES[d.v].reason) {
      reason = prompt(`Reason for ${RES[d.v].short} ${RES[d.v].label} — ${byId(d.m).name}:`, "");
      if (reason === null) return;
      reason = reason.trim();
      if (!reason) return toast("Please write a reason for " + RES[d.v].label + ".");
    }
    await setMark(e, curUnit(e).id, d.m, d.v, reason);
  }),
  allYes: (d) => run(async () => {
    const e = D.events.find((x) => x.id === d.id), uId = curUnit(e).id, q = S.q.toLowerCase();
    const todo = membersOf(e).filter((m) => (S.batch === "all" || m.batch === S.batch) && (!q || m.name.toLowerCase().includes(q)) && m.id !== myMid() && !markOf(uId, m.id));
    if (!todo.length) return toast("Everyone shown is already marked.");
    if (!confirm(`Mark +1 for ${todo.length} unmarked people?`)) return;
    for (const m of todo) await setMark(e, uId, m.id, "yes", "");
  }),
  setFlag: () => run(async () => {
    const y = parseInt($("yellowAt").value, 10), r = parseInt($("redAt").value, 10);
    if (!(y >= 1 && r > y)) return toast("Red must be bigger than yellow, and both must be 1 or more.");
    await setDoc(doc(db, "config", "settings"), { yellowAt: y, redAt: r });
    await addLog({ note: `Set flags: yellow at ${y}, red at ${r} absences in a row` });
  }),
  csv: () => {
    const cell = (v) => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const evs = [...D.events].sort((a, b) => (a.date || "").localeCompare(b.date || ""));
    const lines = [["Name", "Batch", "Email", "Points", "+1", "-0.5", "-1", "Excused", "Events", "Absent events", "Absent in a row", "Flag", ...evs.flatMap((e) => units(e).map((u) => e.name + (u.name ? " - " + u.name : "") + " " + e.date))].map(cell).join(",")];
    for (const m of participants()) { const s = stats(m.id); lines.push([m.name, m.batch, m.email, s.points, s.yes, s.partly, s.no, s.exc, s.events, s.absEv, s.streak, s.level, ...evs.flatMap((e) => units(e).map((u) => { const r = markOf(u.id, m.id); return r ? RES[r.v].score : ""; }))].map(cell).join(",")); }
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
    a.download = `samatvam-participation-${new Date().toISOString().slice(0, 10)}.csv`; document.body.appendChild(a); a.click(); a.remove();
  },
  addMember: () => run(async () => {
    const name = $("nm-name").value.trim(), email = $("nm-email").value.trim().toLowerCase(), batch = $("nm-batch").value;
    if (!name) return toast("Enter a name.");
    if (email && !okEmail(email)) return toast("That email doesn't look right.");
    if (email && D.members.some((m) => m.email === email)) return toast("Someone already has this email.");
    const b = writeBatch(db);
    writeMember(b, { id: rnd("m"), name, batch, email, role: batch === "Faculty" ? "faculty" : $("nm-role").value }, null);
    await b.commit();
    await addLog({ note: `Added ${name} (${batch})` });
  }),
  delMember: (d) => run(async () => {
    const m = byId(d.m); if (!confirm(`Remove ${m.name}? Their marks stay in History.`)) return;
    const b = writeBatch(db); b.delete(doc(db, "members", m.id)); if (m.email) b.delete(doc(db, "access", m.email));
    await b.commit(); await addLog({ note: `Removed ${m.name}` });
  }),
  reloadLog: () => { S.log = null; render(); },
  approve: (d) => run(async () => {
    const r = D.requests[+d.i], mid = $("rq-" + d.i).value, m = byId(mid);
    if (!m) return toast("Pick who this is first.");
    if (m.email) return toast(m.name + " already has an email.");
    const b = writeBatch(db); writeMember(b, { ...m, email: r.email }, m); b.delete(doc(db, "requests", r.email));
    await b.commit(); await addLog({ note: `Approved ${r.email} as ${m.name}` });
  }),
  dismiss: (d) => run(async () => {
    const r = D.requests[+d.i]; if (!confirm(`Remove the request from ${r.email}?`)) return;
    await deleteDoc(doc(db, "requests", r.email)); await addLog({ note: `Turned down sign-in request from ${r.email}` });
  }),
};

async function editMember(t) {
  const m = byId(t.dataset.m); if (!m) return;
  const f = t.dataset.f; let v = t.value.trim();
  const next = { ...m };
  if (f === "name") { if (!v) { t.value = m.name; return; } next.name = v; }
  if (f === "batch") { next.batch = v; if (v === "Faculty") next.role = "faculty"; }
  if (f === "role") next.role = v;
  if (f === "email") {
    v = v.toLowerCase();
    if (v && !okEmail(v)) { toast("That email doesn't look right."); t.value = m.email || ""; return; }
    if (v && D.members.some((x) => x.id !== m.id && x.email === v)) { toast("Someone else already has this email."); t.value = m.email || ""; return; }
    next.email = v;
  }
  await run(async () => {
    const b = writeBatch(db); writeMember(b, next, m); await b.commit();
    await addLog({ note: `Changed ${f} of ${m.name}: “${m[f] || ""}” → “${next[f] || ""}”` });
  });
}
async function renameSub(t) {
  const e = D.events.find((x) => x.id === S.ev); const x = e?.subs.find((y) => y.id === t.dataset.sub);
  const v = t.value.trim(); if (!x) return; if (!v) { t.value = x.name; return; }
  await run(async () => {
    await updateDoc(doc(db, "events", e.id), { subs: e.subs.map((y) => (y.id === x.id ? { ...y, name: v } : y)) });
    await addLog({ note: `Renamed sub-event "${x.name}" to "${v}" in "${e.name}"` });
  });
}

document.addEventListener("click", (e) => { const el = e.target.closest("[data-a]"); if (el && A[el.dataset.a]) A[el.dataset.a](el.dataset); });
document.addEventListener("input", (e) => { if (e.target.id === "q") { S.q = e.target.value; render(); } });
document.addEventListener("change", (e) => { if (e.target.dataset.sub) renameSub(e.target); else if (e.target.dataset.f) editMember(e.target); });
</script>
</body>
</html>
